# Builds api/Dockerfile and rolls the ECS Express Mode service to the new
# image on every push to main that touches the API.
#
# Deliberately does NOT run infra/aws/ecs-deploy.sh. That script bootstraps
# infrastructure — it creates IAM roles, attaches policies, creates the S3
# cache bucket and the service itself — and CI holding iam:CreateRole /
# iam:PutRolePolicy is far more privilege than a deploy needs. Bootstrap stays
# a local, occasional, human-run thing; this only builds, pushes, and updates.
#
# Credentials come from GitHub's OIDC provider assuming an AWS role, so there
# are no long-lived AWS keys in the repo. Run infra/aws/github-oidc-bootstrap.sh
# once to create that role, and infra/aws/secrets-bootstrap.sh once to move
# COCKROACHDB_URL/ALLOWED_ORIGIN into Secrets Manager.
#
# Note this workflow never reads those secret values — it only passes the
# secret's ARN into the task definition, and the ECS *execution role* resolves
# it at container start.
#
# Requires one repo secret: AWS_ACCOUNT_ID.

name: Deploy API

on:
  push:
    branches: [main]
    # Frontend-only pushes shouldn't rebuild and roll the API. Amplify handles
    # the frontend independently off the same push.
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch: {}

# Never let two deploys race to update the same service. Not cancel-in-progress:
# a half-finished deploy that gets cancelled leaves the service in whatever
# state it reached.
concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for OIDC

env:
  AWS_REGION: us-west-2
  ECR_REPO_NAME: book-holder-api
  SERVICE_NAME: book-holder-api
  SECRET_ID: book-holder/api
  CONTAINER_PORT: '8000'
  TASK_ROLE_NAME: book-holder-api-task-role

jobs:
  deploy:
    # arm64 runner, matching the service's ARM64 runtimePlatform. A default
    # x86_64 runner builds an amd64 image that ECS cannot exec ("exec /tini:
    # exec format error"), the task dies, and the service silently rolls back
    # to the previous revision. Native rather than QEMU emulation, which is
    # slow enough to matter on a Deno image. Free for public repos.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Assume AWS deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/book-holder-api-deploy
          aws-region: ${{ env.AWS_REGION }}

      # Runs before the build so a drifted role fails in seconds rather than
      # after an image push and a service roll.
      #
      # This workflow ships code but deliberately holds no IAM *write*
      # permission — applying the task role stays with the human-run
      # ecs-deploy.sh, which is not the deploy path. That gap shipped a real
      # outage: the capture work merged with transcribe:StartStreamTranscription
      # added to ecs-deploy.sh, nobody re-ran it, and every rehearsal in
      # production died 403 behind a green deploy. The mic said "Can't hear you
      # — check your mic", which blames the actor's hardware.
      #
      # So this verifies rather than applies: read-only IAM, and a red build that
      # names the missing action. It simulates against the *same* policy document
      # ecs-deploy.sh applies (infra/aws/task-role-policy.sh) — a second copy
      # inlined here would drift exactly the way the first one did.
      #
      # Simulated per statement rather than as one action/resource matrix,
      # because a matrix cross-products every action against every resource and
      # would fail on polly:SynthesizeSpeech-against-an-S3-ARN, which is a
      # correct denial and not drift.
      #
      # Needs iam:GetContextKeysForPrincipalPolicy/iam:SimulatePrincipalPolicy on
      # the book-holder-api-deploy role — a one-time grant, and read-only.
      - name: Verify the task role grants what the code needs
        run: |
          set -euo pipefail
          ACCOUNT_ID="${{ secrets.AWS_ACCOUNT_ID }}"
          ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/${TASK_ROLE_NAME}"

          POLICY="$(AWS_REGION="$AWS_REGION" ACCOUNT_ID="$ACCOUNT_ID" \
            POLLY_CACHE_BUCKET_NAME="book-holder-polly-cache-${ACCOUNT_ID}" \
            ./infra/aws/task-role-policy.sh)"

          FAILED=0
          # Newline-separated rather than bash arrays: mapfile is bash 4+, and
          # keeping this bash-3 clean is what lets it be run by hand on a Mac
          # before it is trusted in CI. ARNs contain no spaces, so the unquoted
          # expansion below splits correctly and deliberately.
          #
          # One simulate call per *action*, not per statement. Batching a
          # statement's actions into one call fails with "require different
          # authorization information" when they don't share an authorization
          # context — s3:GetObject/s3:PutObject alongside s3:HeadObject does
          # exactly that. Individually they all evaluate fine, and a per-action
          # call also lets the error below name the one that is actually missing.
          while read -r STATEMENT; do
            SID="$(jq -r '.Sid' <<<"$STATEMENT")"
            RESOURCES="$(jq -r '[.Resource] | flatten | .[]' <<<"$STATEMENT")"

            while read -r ACTION; do
              # A "*" resource is the simulator's default, and passing it
              # explicitly is rejected for some actions — so omit it entirely.
              if [ "$RESOURCES" = "*" ]; then
                DECISION="$(aws iam simulate-principal-policy \
                  --policy-source-arn "$ROLE_ARN" \
                  --action-names "$ACTION" \
                  --query 'EvaluationResults[].EvalDecision' --output text)"
              else
                # shellcheck disable=SC2086
                DECISION="$(aws iam simulate-principal-policy \
                  --policy-source-arn "$ROLE_ARN" \
                  --action-names "$ACTION" \
                  --resource-arns $RESOURCES \
                  --query 'EvaluationResults[].EvalDecision' --output text)"
              fi

              if [ "$DECISION" = "allowed" ]; then
                echo "ok: ${SID} — ${ACTION}"
              else
                echo "::error::Task role ${TASK_ROLE_NAME} cannot ${ACTION} (${SID}): ${DECISION}"
                FAILED=1
              fi
            done < <(jq -r '[.Action] | flatten | .[]' <<<"$STATEMENT")
          done < <(jq -c '.Statement[]' <<<"$POLICY")

          if [ "$FAILED" = "1" ]; then
            echo "::error::The deployed task role is behind infra/aws/task-role-policy.sh."
            echo "::error::Run ./infra/aws/ecs-deploy.sh to reapply it, then re-run this workflow."
            echo "::error::Deploying anyway would go green and fail at runtime with an AccessDeniedException."
            exit 1
          fi

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        run: |
          set -euo pipefail
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPO_NAME}"
          # Same short-SHA tagging ecs-deploy.sh uses, so an image can always
          # be traced back to the commit that produced it.
          TAG="$(git rev-parse --short HEAD)"
          # Pinned explicitly, not left to the builder's own architecture, so
          # the image matches the service no matter what builds it.
          docker build --platform linux/arm64 -t "$IMAGE:$TAG" -t "$IMAGE:latest" api
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "uri=$IMAGE:$TAG" >> "$GITHUB_OUTPUT"

      - name: Roll the Express Mode service
        run: |
          set -euo pipefail
          ACCOUNT_ID="${{ secrets.AWS_ACCOUNT_ID }}"
          SERVICE_ARN="arn:aws:ecs:${AWS_REGION}:${ACCOUNT_ID}:service/default/${SERVICE_NAME}"
          TASK_ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/${TASK_ROLE_NAME}"

          # Checked here rather than left to the container, because the failure
          # is otherwise expensive to read: configClient.ts throws on a missing
          # SUPABASE_URL, so the task dies during startup and the rollout
          # reports a health-check failure that says nothing about a variable
          # nobody set. A repository variable rather than a secret — a project
          # URL is public, it is compiled into the frontend bundle already, and
          # it is not a credential (see api/src/features/auth/supabaseJwt.ts for
          # why verification needs none).
          if [ -z "${{ vars.SUPABASE_URL }}" ]; then
            echo "SUPABASE_URL is not set. Add it under Settings -> Secrets and variables -> Actions -> Variables." >&2
            exit 1
          fi

          # Resolve, don't hardcode: Secrets Manager appends a random 6-char
          # suffix to every secret ARN, so it can't be derived from the name.
          SECRET_ARN="$(aws secretsmanager describe-secret \
            --secret-id "$SECRET_ID" --query ARN --output text)"

          # ':KEY::' selects one key out of the secret's JSON, so both values
          # live in a single secret. The trailing empty fields are the
          # version-stage and version-id slots — required, and left blank to
          # mean "current".
          # BEDROCK_MODEL_ID_COMPARISON comes from a repository variable, not a
          # secret — a model id is not sensitive, and Settings -> Variables is
          # where it can be changed without editing this file or shipping a
          # commit. Unset means the default in configClient.ts applies (the Nova
          # Micro geo profile). A blank value would fall through to that default
          # too, since getDenoEnvValueOrDefault treats blank as missing
          # deliberately, so the conditional below is about not declaring an
          # empty variable on the task rather than about correctness.
          #
          # Explanations live out here, in shell comments, and NOT inside the jq
          # program below. The jq program sits in a single-quoted bash string
          # inside $( ), where an apostrophe ends the string and bash parses the
          # remainder as code. A comment reading "configClient.ts's default"
          # shipped exactly that way and broke the deploy with "syntax error near
          # unexpected token ('". It cannot be caught locally either: bash 3.2,
          # which is what macOS ships, defers parsing inside $( ) and reports the
          # file as fine, while bash 5 on the runner rejects it.
          PRIMARY_CONTAINER="$(jq -n \
            --arg image "${{ steps.image.outputs.uri }}" \
            --arg port "$CONTAINER_PORT" \
            --argjson portNum "$CONTAINER_PORT" \
            --arg region "$AWS_REGION" \
            --arg bucket "book-holder-polly-cache-${ACCOUNT_ID}" \
            --arg version "$(git rev-parse --short HEAD)" \
            --arg secretArn "$SECRET_ARN" \
            --arg comparisonModel "${{ vars.BEDROCK_MODEL_ID_COMPARISON }}" \
            --arg supabaseUrl "${{ vars.SUPABASE_URL }}" \
            '{
              image: $image,
              containerPort: $portNum,
              environment: ([
                {name: "PORT",               value: $port},
                {name: "AWS_REGION",         value: $region},
                {name: "POLLY_CACHE_BUCKET", value: $bucket},
                {name: "DENO_ENV",           value: "production"},
                {name: "SUPABASE_URL",       value: $supabaseUrl},
                {name: "APP_VERSION",        value: $version}
              ]
              + (if $comparisonModel != "" then [{name: "BEDROCK_MODEL_ID_COMPARISON", value: $comparisonModel}] else [] end)),
              secrets: [
                {name: "COCKROACHDB_URL", valueFrom: ($secretArn + ":COCKROACHDB_URL::")},
                {name: "ALLOWED_ORIGIN",  valueFrom: ($secretArn + ":ALLOWED_ORIGIN::")}
              ]
            }')"

          aws ecs update-express-gateway-service \
            --region "$AWS_REGION" \
            --service-arn "$SERVICE_ARN" \
            --task-role-arn "$TASK_ROLE_ARN" \
            --primary-container "$PRIMARY_CONTAINER" \
            --monitor-resources

      - name: Wait for this commit to serve traffic
        run: |
          set -euo pipefail
          ACCOUNT_ID="${{ secrets.AWS_ACCOUNT_ID }}"
          SERVICE_ARN="arn:aws:ecs:${AWS_REGION}:${ACCOUNT_ID}:service/default/${SERVICE_NAME}"
          # DescribeExpressGatewayService has no top-level `url`: the endpoint
          # lives at service.activeConfigurations[].ingressPaths[].endpoint.
          # Flattened across configurations because a deploy in progress can
          # report more than one, and returned without a scheme
          # (bo-<id>.ecs.<region>.on.aws), so https:// is prepended below.
          HOST="$(aws ecs describe-express-gateway-service --region "$AWS_REGION" \
            --service-arn "$SERVICE_ARN" \
            --query 'service.activeConfigurations[].ingressPaths[].endpoint | [0]' \
            --output text)"
          if [ -z "$HOST" ] || [ "$HOST" = "None" ]; then
            echo "::error::Could not resolve the service endpoint from describe-express-gateway-service."
            exit 1
          fi
          case "$HOST" in
            http://*|https://*) URL="$HOST" ;;
            *)                  URL="https://$HOST" ;;
          esac
          echo "Service URL: $URL"

          # Match on the reported version, not just a 200: during a rollout
          # both revisions are live and the OLD one answers /health perfectly
          # well, so a status-only check passes instantly and proves nothing.
          WANT="$(git rev-parse --short HEAD)"
          echo "Waiting for version $WANT"
          for attempt in $(seq 1 40); do
            got="$(curl -s --max-time 10 "${URL%/}/health" | jq -r '.version // empty' || true)"
            if [ "$got" = "$WANT" ]; then
              echo "Serving $WANT after ${attempt} attempt(s)."
              exit 0
            fi
            echo "  attempt ${attempt}: serving '${got:-nothing}'"
            sleep 15
          done
          echo "::error::$WANT did not reach the service within 10 minutes."
          exit 1

      # Note this proves the new revision is *answering*, not that the old one
      # has stopped. Both are registered behind the same endpoint during a
      # rollout, so traffic round-robins and a request right after this step
      # can still land on the previous task for a minute or two.
      #
      # Deliberately not waited on here: `aws ecs wait services-stable` needs
      # ecs:DescribeServices, which this role does not have and which isn't
      # worth widening the policy for. Watch the rollout in the ECS console if
      # you need to know the old revision is gone.
