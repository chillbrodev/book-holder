# Builds api/Dockerfile and rolls the ECS Express Mode service to the new
# image on every push to main that touches the API.
#
# Deliberately does NOT run infra/aws/ecs-deploy.sh. That script bootstraps
# infrastructure — it creates IAM roles, attaches policies, creates the S3
# cache bucket and the service itself — and CI holding iam:CreateRole /
# iam:PutRolePolicy is far more privilege than a deploy needs. Bootstrap stays
# a local, occasional, human-run thing; this only builds, pushes, and updates.
#
# Credentials come from GitHub's OIDC provider assuming an AWS role, so there
# are no long-lived AWS keys in the repo. Run infra/aws/github-oidc-bootstrap.sh
# once to create that role, and infra/aws/secrets-bootstrap.sh once to move
# COCKROACHDB_URL/ALLOWED_ORIGIN into Secrets Manager.
#
# Note this workflow never reads those secret values — it only passes the
# secret's ARN into the task definition, and the ECS *execution role* resolves
# it at container start.
#
# Requires one repo secret: AWS_ACCOUNT_ID.

name: Deploy API

on:
  push:
    branches: [main]
    # Frontend-only pushes shouldn't rebuild and roll the API. Amplify handles
    # the frontend independently off the same push.
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch: {}

# Never let two deploys race to update the same service. Not cancel-in-progress:
# a half-finished deploy that gets cancelled leaves the service in whatever
# state it reached.
concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for OIDC

env:
  AWS_REGION: us-west-2
  ECR_REPO_NAME: book-holder-api
  SERVICE_NAME: book-holder-api
  SECRET_ID: book-holder/api
  CONTAINER_PORT: '8000'
  TASK_ROLE_NAME: book-holder-api-task-role

jobs:
  deploy:
    # arm64 runner, matching the service's ARM64 runtimePlatform. A default
    # x86_64 runner builds an amd64 image that ECS cannot exec ("exec /tini:
    # exec format error"), the task dies, and the service silently rolls back
    # to the previous revision. Native rather than QEMU emulation, which is
    # slow enough to matter on a Deno image. Free for public repos.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Assume AWS deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/book-holder-api-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        run: |
          set -euo pipefail
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPO_NAME}"
          # Same short-SHA tagging ecs-deploy.sh uses, so an image can always
          # be traced back to the commit that produced it.
          TAG="$(git rev-parse --short HEAD)"
          # Pinned explicitly, not left to the builder's own architecture, so
          # the image matches the service no matter what builds it.
          docker build --platform linux/arm64 -t "$IMAGE:$TAG" -t "$IMAGE:latest" api
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "uri=$IMAGE:$TAG" >> "$GITHUB_OUTPUT"

      - name: Roll the Express Mode service
        run: |
          set -euo pipefail
          ACCOUNT_ID="${{ secrets.AWS_ACCOUNT_ID }}"
          SERVICE_ARN="arn:aws:ecs:${AWS_REGION}:${ACCOUNT_ID}:service/default/${SERVICE_NAME}"
          TASK_ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/${TASK_ROLE_NAME}"

          # Resolve, don't hardcode: Secrets Manager appends a random 6-char
          # suffix to every secret ARN, so it can't be derived from the name.
          SECRET_ARN="$(aws secretsmanager describe-secret \
            --secret-id "$SECRET_ID" --query ARN --output text)"

          # ':KEY::' selects one key out of the secret's JSON, so both values
          # live in a single secret. The trailing empty fields are the
          # version-stage and version-id slots — required, and left blank to
          # mean "current".
          PRIMARY_CONTAINER="$(jq -n \
            --arg image "${{ steps.image.outputs.uri }}" \
            --arg port "$CONTAINER_PORT" \
            --argjson portNum "$CONTAINER_PORT" \
            --arg region "$AWS_REGION" \
            --arg bucket "book-holder-polly-cache-${ACCOUNT_ID}" \
            --arg version "$(git rev-parse --short HEAD)" \
            --arg secretArn "$SECRET_ARN" \
            '{
              image: $image,
              containerPort: $portNum,
              environment: [
                {name: "PORT",               value: $port},
                {name: "AWS_REGION",         value: $region},
                {name: "POLLY_CACHE_BUCKET", value: $bucket},
                {name: "DENO_ENV",           value: "production"},
                {name: "APP_VERSION",        value: $version}
              ],
              secrets: [
                {name: "COCKROACHDB_URL", valueFrom: ($secretArn + ":COCKROACHDB_URL::")},
                {name: "ALLOWED_ORIGIN",  valueFrom: ($secretArn + ":ALLOWED_ORIGIN::")}
              ]
            }')"

          aws ecs update-express-gateway-service \
            --region "$AWS_REGION" \
            --service-arn "$SERVICE_ARN" \
            --task-role-arn "$TASK_ROLE_ARN" \
            --primary-container "$PRIMARY_CONTAINER" \
            --monitor-resources

      - name: Wait for this commit to serve traffic
        run: |
          set -euo pipefail
          ACCOUNT_ID="${{ secrets.AWS_ACCOUNT_ID }}"
          SERVICE_ARN="arn:aws:ecs:${AWS_REGION}:${ACCOUNT_ID}:service/default/${SERVICE_NAME}"
          # DescribeExpressGatewayService has no top-level `url`: the endpoint
          # lives at service.activeConfigurations[].ingressPaths[].endpoint.
          # Flattened across configurations because a deploy in progress can
          # report more than one, and returned without a scheme
          # (bo-<id>.ecs.<region>.on.aws), so https:// is prepended below.
          HOST="$(aws ecs describe-express-gateway-service --region "$AWS_REGION" \
            --service-arn "$SERVICE_ARN" \
            --query 'service.activeConfigurations[].ingressPaths[].endpoint | [0]' \
            --output text)"
          if [ -z "$HOST" ] || [ "$HOST" = "None" ]; then
            echo "::error::Could not resolve the service endpoint from describe-express-gateway-service."
            exit 1
          fi
          case "$HOST" in
            http://*|https://*) URL="$HOST" ;;
            *)                  URL="https://$HOST" ;;
          esac
          echo "Service URL: $URL"

          # Match on the reported version, not just a 200: during a rollout
          # both revisions are live and the OLD one answers /health perfectly
          # well, so a status-only check passes instantly and proves nothing.
          WANT="$(git rev-parse --short HEAD)"
          echo "Waiting for version $WANT"
          for attempt in $(seq 1 40); do
            got="$(curl -s --max-time 10 "${URL%/}/health" | jq -r '.version // empty' || true)"
            if [ "$got" = "$WANT" ]; then
              echo "Serving $WANT after ${attempt} attempt(s)."
              exit 0
            fi
            echo "  attempt ${attempt}: serving '${got:-nothing}'"
            sleep 15
          done
          echo "::error::$WANT did not reach the service within 10 minutes."
          exit 1

      # The step above proves the new revision is *answering*. It does not
      # prove the old one has stopped: during a rollout both revisions are
      # registered behind the same endpoint, so traffic round-robins between
      # them and a single matching /health response can arrive while the
      # previous task is still taking roughly half the requests.
      #
      # That gap is not academic. A deploy went green here while the old
      # revision was still serving, and a verification request immediately
      # afterwards hit the old code — which, on a cache-miss path, re-cached
      # audio under the pre-deploy key format.
      #
      # `services-stable` waits for runningCount == desiredCount with only the
      # PRIMARY deployment left, which is the actual "this commit, and nothing
      # else, is serving" condition.
      - name: Wait for the previous revision to drain
        run: |
          set -euo pipefail
          aws ecs wait services-stable \
            --region "$AWS_REGION" \
            --cluster default \
            --services "$SERVICE_NAME"
          echo "Rollout complete — only the new revision is serving."
